<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">FinFlow transaction processing architecture</title>
<desc id="desc">A blue technology illustration connecting FastAPI, transaction services, SQLAlchemy and PostgreSQL.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a3a"/><stop offset="1" stop-color="#123d7a"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183f7d"/><stop offset="1" stop-color="#0d2a59"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020817" flood-opacity=".45"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g opacity=".12" stroke="#6cb6ff"><path d="M0 120h1600M0 260h1600M0 400h1600M0 540h1600M0 680h1600M0 820h1600"/><path d="M140 0v900M360 0v900M580 0v900M800 0v900M1020 0v900M1240 0v900M1460 0v900"/></g>
<text x="110" y="135" fill="#8fc8ff" font-family="Arial, sans-serif" font-size="28" letter-spacing="6">TRANSACTION PROCESSING API</text>
<text x="110" y="215" fill="white" font-family="Arial, sans-serif" font-size="72" font-weight="700">FinFlow</text>
<text x="110" y="267" fill="#bfdcff" font-family="Arial, sans-serif" font-size="28">Reliable money movement, validation and transaction history.</text>
<g filter="url(#shadow)" font-family="Arial, sans-serif">
 <g transform="translate(110 390)"><rect width="285" height="210" rx="24" fill="url(#card)" stroke="#378df0" stroke-width="2"/><circle cx="48" cy="48" r="17" fill="#2e9cff"/><text x="36" y="57" fill="white" font-size="24">1</text><text x="35" y="112" fill="white" font-size="31" font-weight="700">FastAPI</text><text x="35" y="155" fill="#acd4ff" font-size="21">Validated REST endpoints</text></g>
 <g transform="translate(470 390)"><rect width="285" height="210" rx="24" fill="url(#card)" stroke="#378df0" stroke-width="2"/><circle cx="48" cy="48" r="17" fill="#2e9cff"/><text x="36" y="57" fill="white" font-size="24">2</text><text x="35" y="112" fill="white" font-size="31" font-weight="700">Service layer</text><text x="35" y="155" fill="#acd4ff" font-size="21">Transaction rules</text><text x="35" y="184" fill="#acd4ff" font-size="21">and balance protection</text></g>
 <g transform="translate(830 390)"><rect width="285" height="210" rx="24" fill="url(#card)" stroke="#378df0" stroke-width="2"/><circle cx="48" cy="48" r="17" fill="#2e9cff"/><text x="36" y="57" fill="white" font-size="24">3</text><text x="35" y="112" fill="white" font-size="31" font-weight="700">SQLAlchemy</text><text x="35" y="155" fill="#acd4ff" font-size="21">Atomic persistence</text><text x="35" y="184" fill="#acd4ff" font-size="21">and row locking</text></g>
 <g transform="translate(1190 390)"><rect width="285" height="210" rx="24" fill="url(#card)" stroke="#378df0" stroke-width="2"/><circle cx="48" cy="48" r="17" fill="#2e9cff"/><text x="36" y="57" fill="white" font-size="24">4</text><text x="35" y="112" fill="white" font-size="31" font-weight="700">PostgreSQL</text><text x="35" y="155" fill="#acd4ff" font-size="21">Customers, accounts</text><text x="35" y="184" fill="#acd4ff" font-size="21">and transactions</text></g>
</g>
<g stroke="#65b3ff" stroke-width="6" fill="none"><path d="M405 495h50"/><path d="M765 495h50"/><path d="M1125 495h50"/></g>
<g fill="#65b3ff"><path d="M455 495l-18-12v24z"/><path d="M815 495l-18-12v24z"/><path d="M1175 495l-18-12v24z"/></g>
<g transform="translate(110 720)" font-family="Arial, sans-serif"><rect width="1365" height="80" rx="18" fill="#071a3a" stroke="#286ebc"/><text x="34" y="50" fill="#5bc0ff" font-size="24">PYTHON</text><text x="200" y="50" fill="#789bc4" font-size="24">•</text><text x="245" y="50" fill="#5bc0ff" font-size="24">PYTEST</text><text x="390" y="50" fill="#789bc4" font-size="24">•</text><text x="435" y="50" fill="#5bc0ff" font-size="24">DOCKER</text><text x="585" y="50" fill="#789bc4" font-size="24">•</text><text x="630" y="50" fill="#5bc0ff" font-size="24">GITHUB ACTIONS</text><text x="870" y="50" fill="#789bc4" font-size="24">•</text><text x="915" y="50" fill="#5bc0ff" font-size="24">OPENAPI</text></g>
